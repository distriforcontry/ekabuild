# EKA BUILD — edge proxy & load balancer
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { model/gltf-binary glb; model/gltf+json gltf; image/x-exr exr; }

  log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                  'urt=$upstream_response_time upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 210m;   # 3D models & drawings
  client_body_timeout 120s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml
             image/svg+xml image/x-icon application/manifest+json model/gltf+json model/gltf-binary font/ttf;

  # edge cache for static files proxied from Next.js (see snippets/static-cache.conf)
  proxy_cache_path /var/cache/nginx/eka levels=1:2 keys_zone=eka_static:20m max_size=2g inactive=14d use_temp_path=off;

  # Docker DNS — lets upstreams follow container restarts / IP changes
  resolver 127.0.0.11 valid=10s ipv6=off;

  # rate limiting (per client IP; the API also enforces its own Redis-backed limits)
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;

  # WebSocket upgrade
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  # retry another replica on connection errors / 502-504 (idempotent requests only)
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  include /etc/nginx/conf.d/*.conf;
}
