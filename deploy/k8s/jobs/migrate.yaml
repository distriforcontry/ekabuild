# Applied by deploy.sh before each rollout: runs Prisma migrations + idempotent seed, then exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ekabuild
  labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: ekabuild }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: migrate
          image: ghcr.io/distriforcontry/ekabuild-api:latest
          command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && node dist/seed.js"]
          envFrom:
            - configMapRef: { name: ekabuild-config }
            - secretRef: { name: ekabuild-secrets }
          env:
            - { name: SEED_DEMO, value: "false" }
          volumeMounts: [{ name: uploads, mountPath: /data/uploads }]
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploads }
