# DO NOT COMMIT REAL VALUES. Create the secret with:
#   kubectl -n ekabuild create secret generic ekabuild-secrets --from-env-file=secrets.env
# or manage it with Sealed Secrets / External Secrets. Keys expected by the manifests:
apiVersion: v1
kind: Secret
metadata:
  name: ekabuild-secrets
  namespace: ekabuild
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me
  MYSQL_PASSWORD: change-me
  DATABASE_URL: mysql://eka:change-me@mysql:3306/ekabuild
  RABBITMQ_PASSWORD: change-me
  RABBITMQ_URL: amqp://eka:change-me@rabbitmq:5672
  JWT_SECRET: generate-with-openssl-rand-base64-48
  ESKIZ_EMAIL: ""
  ESKIZ_PASSWORD: ""
  ESKIZ_FROM: "4546"
  S3_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  SUPERADMIN_PHONE: "+998XXXXXXXXX"
  SUPERADMIN_PASSWORD: change-me
