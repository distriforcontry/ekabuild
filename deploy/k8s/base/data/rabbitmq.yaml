# Single RabbitMQ node. For a 3-node quorum cluster install the RabbitMQ Cluster Operator and replace this file
# with a `RabbitmqCluster` resource — queues are declared by the app, so nothing else changes.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
    - { name: prometheus, port: 15692 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: queue }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: prometheus, containerPort: 15692 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: eka }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: ekabuild-secrets, key: RABBITMQ_PASSWORD } }
            - { name: RABBITMQ_NODENAME, value: rabbit@localhost }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
