apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      terminationGracePeriodSeconds: 60   # let in-flight jobs finish (unacked messages are redelivered anyway)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ekabuild-api
          command: ["node", "dist/worker.js"]
          ports: [{ name: metrics, containerPort: 9100 }]
          envFrom:
            - configMapRef: { name: ekabuild-config }
            - secretRef: { name: ekabuild-secrets }
          env:
            - name: INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: SERVICE_NAME
              value: worker
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploads }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  labels: { app.kubernetes.io/name: worker }
spec:
  selector: { app.kubernetes.io/name: worker }
  ports: [{ name: metrics, port: 9100, targetPort: metrics }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
