apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: api } }
  endpoints: [{ port: http, path: /metrics, interval: 15s }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: worker
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
  endpoints: [{ port: metrics, interval: 15s }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: rabbitmq } }
  endpoints: [{ port: prometheus, path: /metrics/detailed, params: { family: [queue_coarse_metrics] }, interval: 30s }]
