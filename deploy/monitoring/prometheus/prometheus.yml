global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { project: ekabuild }

rule_files: ["/etc/prometheus/alerts.yml"]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-1:4000", "api-2:4000"]
  - job_name: worker
    static_configs:
      - targets: ["worker-1:9100", "worker-2:9100"]
  - job_name: rabbitmq
    # per-queue metrics (queue depth, DLQs) live on the detailed endpoint
    metrics_path: /metrics/detailed
    params: { family: [queue_coarse_metrics] }
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: rabbitmq-node
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: mysql
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: nginx
    static_configs: [{ targets: ["nginx-exporter:9113"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
